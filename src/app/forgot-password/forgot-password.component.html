<div class="forgot-password-wrapper">
  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
    <h2>Reset Password</h2>
    <div>
      <label for="emailOrPhone">Email or Phone Number</label>
      <input id="emailOrPhone" formControlName="emailOrPhone" type="text" />
      <div *ngIf="submitted && resetForm.controls['emailOrPhone'].errors">
        <small *ngIf="resetForm.controls['emailOrPhone'].errors?.['required']">This field is required.</small>
      </div>
    </div>
    <button type="submit">Send Reset Link</button>
    <div *ngIf="message" class="reset-message">{{ message }}</div>
  </form>
  <div class="forgot-3d-bg"></div>
</div>
