<div class="login-container">
    <h2>Welcome Back!</h2>
    <p>Please log in to continue.</p>
  
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input id="username" type="text" formControlName="username" placeholder="Enter your username" />
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          <small class="error">Username is required.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password:</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          (focus)="togglePasswordInstructions()"
          (blur)="togglePasswordInstructions()"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <small class="error">Password must be at least 6 characters long.</small>
        </div>
        <div *ngIf="showPasswordInstructions" class="password-instructions">
          <small>Password must be at least 6 characters long and contain a mix of letters and numbers.</small>
        </div>
      </div>
  
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
  
    <div class="forgot-password">
      <a href="javascript:void(0)" (click)="forgotPassword()">Forgot Password?</a>
    </div>
  </div>
