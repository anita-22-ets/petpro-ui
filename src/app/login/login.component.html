<div class="login-wrapper">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <h2 class="form-title">Sign In</h2>
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" formControlName="username" type="text" />
      <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        <small *ngIf="loginForm.get('username')?.errors?.['required']">Username is required.</small>
      </div>
    </div>
    <div class="form-group">
      <label for="password">
        Password
      </label>
      <input id="password" formControlName="password" type="password" />
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</small>
        <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</small>
      </div>
    </div>
    <a class="forgot-link" (click)="forgotPassword()">Forgot password?</a>
    <button type="submit" class="login-btn" [disabled]="loginForm.get('password')?.invalid">Login</button>
  </form>
  <div class="login-3d-bg"></div>
</div>
