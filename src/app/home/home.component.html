<div class="home-container">
  <section class="actions top-right">
    <button routerLink="/user-registration" (click)="navigateToRegistration()">Register</button>
    <button routerLink="/login" (click)="navigateToLogin()">Login</button>
  </section>

  <h1>Welcome to PetPro <img src="cat-caregivers.png" alt="Logo" width="32" height="32" style="vertical-align: middle; margin-right: 8px;"></h1>
  <p>Discover our services and unique features designed for you.</p>

  <section class="usps">
    <h2>Why Choose Us?</h2>
    <div class="dashboard">
      <div class="dashboard-section" *ngFor="let feature of features">
        <i class="icon" [ngClass]="feature.icon"></i>
        <h3>{{ feature.text }}</h3>
      </div>
    </div>
  </section>

  <section class="actions bottom">
    <button routerLink="/services" (click)="navigateToExploreServices()">Explore Services</button>
  </section>
</div>
